name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the unit tests
        run: node --test tests/*.test.js

  # One job per Playwright project, so a failure says where the game broke.
  browser:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
          - project: phone
            browser: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Playwright
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run the browser tests
        run: npx playwright test --project=${{ matrix.project }}

  # The game is published only from main, and only when every test passes. Uploading and
  # deploying are separate jobs on purpose: in one job, deploy-pages looks the artifact up a
  # fraction of a second after the upload and sometimes finds none (actions/deploy-pages#451).
  pages-artifact:
    name: Prepare the Pages files
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [unit, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect the game files
        run: |
          mkdir _site
          cp -r index.html css js _site/
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Stamp the release with its version
        run: node scripts/stamp-release.js _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
